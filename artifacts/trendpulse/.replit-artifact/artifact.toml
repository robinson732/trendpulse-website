kind = "web"
previewPath = "/"
title = "TrendPulse"
version = "1.0.0"
id = "artifacts/trendpulse"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19488

[services.development]
run = "pnpm --filter @workspace/trendpulse run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/trendpulse", "run", "build" ]
publicDir = "artifacts/trendpulse/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19488"
BASE_PATH = "/"
